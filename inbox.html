<head>

    <style>
        :root {
            --nav-bg: #272c30;
            --nav-hover: #343a40;
            --nav-active: #1d2124;
            --folder-bg: #f8f9fa;
            --border: #dee2e6;
            --text-primary: #212529;
            --text-secondary: #6c757d;
            --link-color: #007bff;
            --selected-row: #e8f0fe;
            --white: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            font-size: 13px;
            color: var(--text-primary);
            background-color: var(--white);
            height: 100vh;
            display: flex;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* Column 1: Task Bar */
        .taskbar {
            width: 52px;
            background-color: var(--nav-bg);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px 0;
            flex-shrink: 0;
        }

        .taskbar .app-logo {
            margin-bottom: 15px;
            cursor: pointer;
        }

        .taskbar button, .taskbar a {
            width: 40px;
            height: 40px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #adb5bd;
            background: transparent;
            border: none;
            cursor: pointer;
            text-decoration: none;
            margin-bottom: 4px;
            transition: background-color 0.1s, color 0.1s;
        }

        .taskbar button:hover, .taskbar a:hover {
            background-color: var(--nav-hover);
            color: #ffffff;
        }

        .taskbar button.active, .taskbar a.active {
            background-color: var(--nav-active);
            color: #ffffff;
        }

        .taskbar .spacer {
            flex: 1;
        }

        /* Column 2: Folder Pane */
        .folder-pane {
            width: 190px;
            background-color: var(--folder-bg);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }

        .folder-header {
            padding: 10px 14px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--text-secondary);
            letter-spacing: 0.5px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .folder-list {
            list-style: none;
            padding: 6px 0;
            flex: 1;
            overflow-y: auto;
        }

        .folder-list li button {
            width: 100%;
            display: flex;
            align-items: center;
            padding: 7px 14px;
            color: var(--text-primary);
            background: transparent;
            border: none;
            cursor: pointer;
            font-size: 13px;
            gap: 10px;
            text-align: left;
        }

        .folder-list li button:hover {
            background-color: #e9ecef;
        }

        .folder-list li.active button {
            background-color: #e2e6ea;
            font-weight: 600;
        }

        .badge-count {
            margin-left: auto;
            background: #adb5bd;
            color: #fff;
            padding: 0 6px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: 600;
        }

        .folder-list li.active .badge-count {
            background: #007bff;
        }

        .quota-box {
            padding: 10px 14px;
            border-top: 1px solid var(--border);
            font-size: 11px;
            color: var(--text-secondary);
        }

        .quota-bar {
            height: 4px;
            background: #dee2e6;
            border-radius: 2px;
            margin-top: 5px;
            overflow: hidden;
        }

        .quota-bar-fill {
            height: 100%;
            width: 4%;
            background: #28a745;
        }

        /* Column 3: Message List */
        .message-list-pane {
            width: 340px;
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            background: var(--white);
        }

        .toolbar {
            padding: 8px 10px;
            border-bottom: 1px solid var(--border);
            background: #f8f9fa;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .search-input {
            width: 100%;
            padding: 5px 9px;
            font-size: 12px;
            border: 1px solid #ced4da;
            border-radius: 3px;
            outline: none;
        }

        .search-input:focus {
            border-color: #80bdff;
        }

        .message-rows {
            list-style: none;
            overflow-y: auto;
            flex: 1;
        }

        .message-row {
            padding: 10px 12px;
            border-bottom: 1px solid #f1f3f5;
            cursor: pointer;
            position: relative;
        }

        .message-row:hover {
            background-color: #f8f9fa;
        }

        .message-row.selected {
            background-color: var(--selected-row);
        }

        .message-row.unread .sender-text {
            font-weight: 700;
        }

        .message-row.unread .subject-text {
            font-weight: 600;
        }

        .row-line1 {
            display: flex;
            justify-content: space-between;
            margin-bottom: 3px;
        }

        .sender-text {
            font-size: 13px;
            color: var(--text-primary);
        }

        .date-text {
            font-size: 11px;
            color: var(--text-secondary);
        }

        .subject-text {
            font-size: 12px;
            color: #495057;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 2px;
        }

        .snippet-text {
            font-size: 11px;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .empty-placeholder {
            padding: 30px 15px;
            text-align: center;
            color: var(--text-secondary);
            font-size: 12px;
        }

        /* Column 4: Message Preview */
        .preview-pane {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--white);
            overflow: hidden;
        }

        .action-toolbar {
            padding: 6px 14px;
            border-bottom: 1px solid var(--border);
            background: #f8f9fa;
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .btn-ui {
            background: #ffffff;
            border: 1px solid #ced4da;
            border-radius: 3px;
            padding: 4px 10px;
            font-size: 12px;
            cursor: pointer;
            color: #495057;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .btn-ui:hover {
            background: #f1f3f5;
        }

        .btn-ui.primary {
            background: #007bff;
            border-color: #007bff;
            color: #ffffff;
        }

        .btn-ui.primary:hover {
            background: #0069d9;
        }

        .current-account {
            margin-left: auto;
            font-size: 11px;
            color: var(--text-secondary);
        }

        .current-account span {
            color: var(--text-primary);
            font-weight: 600;
        }

        .preview-header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
        }

        .preview-subject {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 12px;
        }

        .header-table {
            font-size: 12px;
            border-collapse: collapse;
        }

        .header-table td {
            padding: 2px 0;
        }

        .header-table td.label {
            color: var(--text-secondary);
            width: 60px;
        }

        .header-table td.val {
            color: var(--text-primary);
        }

        .preview-content {
            padding: 0;
            font-size: 13px;
            line-height: 1.6;
            color: #212529;
            flex: 1;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .preview-content hr {
            border: 0;
            border-top: 1px solid #e9ecef;
            margin: 15px 0;
        }

        /* Compose / View Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.4);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal-dialog {
            background: #ffffff;
            width: 550px;
            border-radius: 4px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .modal-head {
            background: #272c30;
            color: #ffffff;
            padding: 10px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 600;
        }

        .modal-head button {
            background: transparent;
            border: none;
            color: #ffffff;
            font-size: 16px;
            cursor: pointer;
        }

        .modal-body {
            padding: 16px;
        }

        .modal-body .form-group {
            margin-bottom: 12px;
        }

        .modal-body label {
            display: block;
            font-size: 11px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }

        .modal-body input, .modal-body textarea {
            width: 100%;
            padding: 6px 10px;
            border: 1px solid var(--border);
            border-radius: 3px;
            font-size: 13px;
            outline: none;
        }

        .modal-body textarea {
            height: 130px;
            resize: vertical;
        }

        .modal-foot {
            background: #f8f9fa;
            padding: 10px 16px;
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: flex-end;
            gap: 8px;
        }

        /* Toast notification */
        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #32383e;
            color: #fff;
            padding: 8px 16px;
            border-radius: 4px;
            font-size: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
            display: none;
            z-index: 2000;
        }
    </style>
</head>
<body>

    <!-- 1. Task Bar -->
    <div class="taskbar">

    <div class="folder-pane">
        <div class="folder-header">

    <script>
        let currentFolder = 'inbox';
        let currentActiveId = 1;

        const mailDatabase = {

        function showToast(text) {
            const toast = document.getElementById('toast-el');
            toast.innerText = text;
            toast.style.display = 'block';
            setTimeout(() => { toast.style.display = 'none'; }, 2500);
        }

        function renderMailList(filterText = "") {
            const listEl = document.getElementById('message-list');
            listEl.innerHTML = "";

            const items = mailDatabase[currentFolder].filter(m => 
                m.subject.toLowerCase().includes(filterText.toLowerCase()) || 
                m.sender.toLowerCase().includes(filterText.toLowerCase())
            );

            if (items.length === 0) {
                listEl.innerHTML = `<div class="empty-placeholder">No messages in this folder</div>`;
                document.getElementById('subject-el').innerText = "(No message selected)";
                document.getElementById('from-el').innerText = "-";
                document.getElementById('date-el').innerText = "-";
                document.getElementById('body-el').innerHTML = "<p style='color:#6c757d;'>Select a message to read.</p>";
                return;
            }

            items.forEach(m => {
                const li = document.createElement('li');
                li.className = `message-row ${m.id === currentActiveId ? 'selected' : ''} ${m.unread ? 'unread' : ''}`;
                li.onclick = () => selectMail(m.id);
                li.innerHTML = `
                    <div class="row-line1">
                        <span class="sender-text">${m.sender}</span>
                        <span class="date-text">${m.date}</span>
                    </div>
                    <div class="subject-text">${m.subject}</div>
                    <div class="snippet-text">${m.snippet}</div>
                `;
                listEl.appendChild(li);
            });

            // If active item exists in current folder, preview it
            const activeMail = mailDatabase[currentFolder].find(m => m.id === currentActiveId) || items[0];
            if (activeMail) {
                currentActiveId = activeMail.id;
                showPreview(activeMail);
            }
        }

        function showPreview(mail) {
            document.getElementById('subject-el').innerText = mail.subject;
            document.getElementById('from-el').innerHTML = mail.from;
            document.getElementById('date-el').innerText = mail.date;
            
            const iframe = document.getElementById('mail-iframe');
            if (iframe) {
                if (mail.contentKey && typeof emailHtmlData !== 'undefined' && emailHtmlData[mail.contentKey]) {
                    iframe.srcdoc = emailHtmlData[mail.contentKey];
                } else if (mail.body) {
                    iframe.srcdoc = mail.body;
                }
            }
        }

        function selectMail(id) {
            currentActiveId = id;
            const mail = mailDatabase[currentFolder].find(m => m.id === id);
            if (mail) {
                mail.unread = false;
                showPreview(mail);
                renderMailList();
            }
        }

        function selectFolder(folderName, el) {
            currentFolder = folderName;
            document.querySelectorAll('.folder-list li').forEach(li => li.classList.remove('active'));
            el.closest('li').classList.add('active');
            renderMailList();
            showToast(`Switched to ${folderName.toUpperCase()}`);
        }

        function refreshFolder() {
            showToast("Checking for new messages...");
            setTimeout(() => {
                renderMailList();
                showToast("Folder is up to date");
            }, 600);
        }

        function handleSearch(val) {
            renderMailList(val);
        }

        function deleteCurrentMail() {
            const list = mailDatabase[currentFolder];
            const idx = list.findIndex(m => m.id === currentActiveId);
            if (idx > -1) {
                const [deleted] = list.splice(idx, 1);
                if (currentFolder !== 'trash') {
                    mailDatabase.trash.push(deleted);
                }
                showToast("Message deleted");
                renderMailList();
            }
        }

        function markUnreadCurrentMail() {
            const mail = mailDatabase[currentFolder].find(m => m.id === currentActiveId);
            if (mail) {
                mail.unread = true;
                renderMailList();
                showToast("Marked as unread");
            }
        }

        function openComposeModal(to = "", subject = "", body = "") {
            document.getElementById('compose-to').value = to;
            document.getElementById('compose-subject').value = subject;
            document.getElementById('compose-body').value = body;
            document.getElementById('compose-modal').style.display = 'flex';
        }

        function closeComposeModal() {
            document.getElementById('compose-modal').style.display = 'none';
        }

        function replyCurrentMail() {
            const mail = mailDatabase[currentFolder].find(m => m.id === currentActiveId);
            if (mail) {
                openComposeModal(mail.from, "Re: " + mail.subject, `\n\n--- Original Message ---\nFrom: ${mail.from}\nDate: ${mail.date}\n`);
            }
        }

        function forwardCurrentMail() {
            const mail = mailDatabase[currentFolder].find(m => m.id === currentActiveId);
            if (mail) {
                openComposeModal("", "Fwd: " + mail.subject, `\n\n--- Forwarded Message ---\nFrom: ${mail.from}\nDate: ${mail.date}\nSubject: ${mail.subject}\n`);
            }
        }

        function sendMail() {
            const to = document.getElementById('compose-to').value;
            const sub = document.getElementById('compose-subject').value || "(No Subject)";
            const body = document.getElementById('compose-body').value;

            if (!to) {
                alert("Please specify a recipient email address.");
                return;
            }

            mailDatabase.sent.push({
                id: Date.now(),
                sender: "Me",
                from: "pelanisede@bandannamail.co.in",
                date: "Just now",
                subject: sub,
                snippet: body.substring(0, 45) + "...",
                body: `<p>${body.replace(/\n/g, '<br>')}</p>`,
                unread: false
            });

            closeComposeModal();
            showToast("Message sent successfully");
        }

        function switchSection(sec) {
            document.querySelectorAll('.taskbar button').forEach(b => b.classList.remove('active'));
            if (sec === 'mail') {
                document.getElementById('btn-nav-mail').classList.add('active');
                showToast("Switched to Mail view");
            } else if (sec === 'contacts') {
                document.getElementById('btn-nav-contacts').classList.add('active');
                showToast("Address Book / Contacts is empty");
            } else if (sec === 'settings') {
                document.getElementById('btn-nav-settings').classList.add('active');
                showToast("Settings: Preferences loaded");
            }
        }

        // Initial setup
        renderMailList();
    </script>
