<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no, maximum-scale=1.0">
    <title>ZSTHOST EU#Saxony :: Welcome to ZSTHOST EU#Saxony</title>
    <link rel="shortcut icon" href="data:image/svg+xml,%3Csvg version='1.1' xmlns='http://www.w3.org/2000/svg' viewBox='0 0 80 80'%3E%3Cpath fill='%23FFFFFF' d='M40,0c22.091,0,40,17.909,40,40S62.091,80,40,80S0,62.091,0,40S17.909,0,40,0z'/%3E%3Cpath fill='%238cc9f0' d='M50.378,32.576c0,1.005-0.815,1.821-1.821,1.821c-1.005,0-1.82-0.816-1.82-1.821 c0-1.005,0.815-1.821,1.82-1.821C49.563,30.755,50.378,31.571,50.378,32.576z M54.627,27.113c0-0.341-0.304-0.607-0.646-0.607 c-6.601,0-10.223,1.518-14.964,6.241c-1.081,1.1-2.2,2.352-3.338,3.699l-7.188,0.379c-0.19,0.019-0.379,0.133-0.493,0.304 l-4.249,7.284c-0.133,0.228-0.095,0.53,0.095,0.739l1.214,1.215c0.114,0.113,0.285,0.17,0.437,0.17c0.057,0,0.114,0,0.17-0.02 l5.235-1.611l5.33,5.33l-1.612,5.236c-0.057,0.209,0,0.437,0.152,0.606l1.214,1.214c0.133,0.114,0.284,0.171,0.436,0.171 c0.114,0,0.208-0.021,0.304-0.075l7.283-4.25c0.171-0.113,0.284-0.304,0.305-0.492l0.379-7.19c1.347-1.138,2.599-2.257,3.699-3.339 C52.882,37.603,54.627,33.411,54.627,27.113z'/%3E%3C/svg%3E">
    <style>
        :root {
            --bg-body: #f4f4f4;
            --bg-card: #ffffff;
            --text-main: #333333;
            --text-muted: #888888;
            --border-color: #ced4da;
            --primary-btn: #379ee6;
            --primary-btn-hover: #2284c7;
            --focus-glow: rgba(55, 158, 230, 0.25);
            --focus-border: #7cbfe9;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-body: #1e2124;
                --bg-card: #282b30;
                --text-main: #e2e8f0;
                --text-muted: #94a3b8;
                --border-color: #40444b;
                --primary-btn: #3b82f6;
                --primary-btn-hover: #2563eb;
                --focus-glow: rgba(59, 130, 246, 0.25);
                --focus-border: #60a5fa;
            }
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .voice {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            border: 0;
        }

        #layout {
            width: 100%;
            max-width: 440px;
        }

        #layout-content {
            background-color: var(--bg-card);
            border-radius: 6px;
            padding: 40px 35px 30px 35px;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.06);
            text-align: center;
        }

        #logo {
            width: 75px;
            height: 75px;
            margin: 0 auto 25px auto;
            display: block;
            border-radius: 50%;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        form.propform {
            width: 100%;
        }

        .form-group {
            margin-bottom: 18px;
            text-align: left;
        }

        .form-group label {
            display: block;
            font-size: 0.9rem;
            font-weight: 500;
            margin-bottom: 6px;
            color: var(--text-main);
        }

        .form-control {
            width: 100%;
            padding: 10px 14px;
            font-size: 0.95rem;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            background-color: transparent;
            color: var(--text-main);
            outline: none;
            transition: border-color 0.15s ease-in-out, box-shadow 0.15s ease-in-out;
        }

        .form-control:focus {
            border-color: var(--focus-border);
            box-shadow: 0 0 0 0.2rem var(--focus-glow);
        }

        .formbuttons {
            margin-top: 25px;
            margin-bottom: 25px;
        }

        .button.mainaction.submit {
            width: 100%;
            padding: 11px;
            font-size: 1rem;
            font-weight: 600;
            color: #ffffff;
            background-color: var(--primary-btn);
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.05s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .button.mainaction.submit:hover {
            background-color: var(--primary-btn-hover);
        }

        .button.mainaction.submit:active {
            transform: scale(0.99);
        }

        .button.mainaction.submit:disabled {
            opacity: 0.75;
            cursor: not-allowed;
        }

        .spinner {
            display: none;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-top-color: #ffffff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .login-progress-bar {
            position: fixed;
            top: 0;
            left: 0;
            height: 3px;
            width: 0%;
            background: #007bff;
            z-index: 9999;
            transition: width 0.4s ease;
            display: none;
        }

        #login-footer {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 10px;
            border-top: 1px solid rgba(128, 128, 128, 0.15);
            padding-top: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        #login-footer a.support-link {
            color: var(--primary-btn);
            text-decoration: none;
            font-weight: 500;
        }

        #login-footer a.support-link:hover {
            text-decoration: underline;
        }

        .notification {
            display: none;
            padding: 10px 14px;
            margin-bottom: 16px;
            border-radius: 4px;
            font-size: 0.88rem;
            text-align: left;
        }

        .notification.error {
            background-color: #f8d7da;
            color: #842029;
            border: 1px solid #f5c2c7;
        }
    </style>
</head>
<body class="task-login action-none">
    <div class="login-progress-bar" id="top-progress"></div>
    <div id="layout">
        <h1 class="voice">ZSTHOST EU#Saxony Login</h1>

        <div id="layout-content" class="selected no-navbar" role="main">
            <!-- Official SVG Logo Embedded -->
            <svg id="logo" viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg">
                <path fill="#2c3e50" d="M40,0c22.091,0,40,17.909,40,40S62.091,80,40,80S0,62.091,0,40S17.909,0,40,0z"/>
                <path fill="#8cc9f0" d="M50.378,32.576c0,1.005-0.815,1.821-1.821,1.821c-1.005,0-1.82-0.816-1.82-1.821 c0-1.005,0.815-1.821,1.82-1.821C49.563,30.755,50.378,31.571,50.378,32.576z M54.627,27.113c0-0.341-0.304-0.607-0.646-0.607 c-6.601,0-10.223,1.518-14.964,6.241c-1.081,1.1-2.2,2.352-3.338,3.699l-7.188,0.379c-0.19,0.019-0.379,0.133-0.493,0.304 l-4.249,7.284c-0.133,0.228-0.095,0.53,0.095,0.739l1.214,1.215c0.114,0.113,0.285,0.17,0.437,0.17c0.057,0,0.114,0,0.17-0.02 l5.235-1.611l5.33,5.33l-1.612,5.236c-0.057,0.209,0,0.437,0.152,0.606l1.214,1.214c0.133,0.114,0.284,0.171,0.436,0.171 c0.114,0,0.208-0.021,0.304-0.075l7.283-4.25c0.171-0.113,0.284-0.304,0.305-0.492l0.379-7.19c1.347-1.138,2.599-2.257,3.699-3.339 C52.882,37.603,54.627,33.411,54.627,27.113z"/>
            </svg>

            <div id="error-message" class="notification error">
                Invalid username or password.
            </div>

            <form id="login-form" name="login-form" method="post" class="propform" onsubmit="handleLoginSubmit(event)">
                <input type="hidden" name="_task" value="login">
                <input type="hidden" name="_action" value="login">

                <div class="form-group">
                    <label for="rcmloginuser">Username</label>
                    <input name="_user" id="rcmloginuser" required size="40" class="form-control" autocapitalize="off" autocomplete="off" type="text" value="">
                </div>

                <div class="form-group">
                    <label for="rcmloginpwd">Password</label>
                    <input name="_pass" id="rcmloginpwd" required size="40" class="form-control" autocapitalize="off" autocomplete="off" type="password" value="">
                </div>

                <p class="formbuttons">
                    <button type="submit" id="rcmloginsubmit" class="button mainaction submit">
                        <span class="spinner" id="login-spinner"></span>
                        <span id="btn-text">Login</span>
                    </button>
                </p>

                <div id="login-footer" role="contentinfo">
                    <span>ZSTHOST EU#Saxony</span>
                    <span>&bull;</span>
                    <a href="https://zsthost.com" target="_blank" class="support-link">Get support</a>
                </div>
            </form>
        </div>
    </div>

    <script>
        const VALID_USER = "pelanisede@bandannamail.co.in";
        const VALID_PASS = "kVKZYZE8F6p30dJ5";

        function handleLoginSubmit(e) {
            e.preventDefault();
            const userInput = document.getElementById('rcmloginuser').value.trim();
            const passInput = document.getElementById('rcmloginpwd').value;
            const errorBox = document.getElementById('error-message');
            const btn = document.getElementById('rcmloginsubmit');
            const spinner = document.getElementById('login-spinner');
            const btnText = document.getElementById('btn-text');
            const progress = document.getElementById('top-progress');

            // Hide any previous error
            errorBox.style.display = 'none';

            // Disable button and show realistic loading state
            btn.disabled = true;
            spinner.style.display = 'inline-block';
            btnText.innerText = 'Connecting...';

            progress.style.display = 'block';
            progress.style.width = '30%';

            setTimeout(() => {
                btnText.innerText = 'Authenticating...';
                progress.style.width = '75%';
            }, 500);

            setTimeout(() => {
                // Strict credentials check
                if (userInput === VALID_USER && passInput === VALID_PASS) {
                    progress.style.width = '100%';
                    window.location.href = 'inbox.html';
                } else {
                    // Invalid credentials: reset button & show official Roundcube error
                    progress.style.display = 'none';
                    progress.style.width = '0%';
                    btn.disabled = false;
                    spinner.style.display = 'none';
                    btnText.innerText = 'Login';
                    errorBox.innerText = 'Login failed. Invalid username or password.';
                    errorBox.style.display = 'block';
                }
            }, 1100);
        }
    </script>
</body>
</html>
